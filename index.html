<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rent-A-Toy!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: rgb(35, 35, 35);
      color: white;
    }

    /* --- Password Lock Screen --- */
    #password-screen {
      position: fixed;
      inset: 0;
      background-color: rgb(30, 30, 30);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .login-box {
      background-color: rgb(50, 50, 50);
      padding: 40px;
      border-radius: 12px;
      border-top: 4px solid rgb(255, 140, 140);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 90%;
      max-width: 380px;
    }

    .login-box h2 {
      margin-bottom: 10px;
      font-size: 1.8rem;
    }

    .login-box p {
      color: rgb(200, 200, 200);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      border: 2px solid rgb(80, 80, 80);
      border-radius: 6px;
      background-color: rgb(35, 35, 35);
      color: white;
      font-size: 1rem;
      margin-bottom: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-box input:focus {
      border-color: rgb(255, 140, 140);
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: rgb(200, 70, 70);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .login-box button:hover {
      background-color: rgb(230, 90, 90);
    }

    #error-msg {
      color: rgb(255, 140, 140);
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
    }

    
    #main-site {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
      border-bottom: 4px solid rgb(255, 140, 140);
      background-color: rgb(50, 50, 50);
    }

    .main-text {
      display: flex;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .mtxt1, .mtxt2 {
      transition: color 0.3s ease;
    }

    .mtxt1 {
      color: rgb(200, 70, 70);
    }

    .mtxt2 {
      color: rgb(140, 140, 140);
    }

    .main-text:hover .mtxt1 {
      color: rgb(140, 140, 140);
    }

    .main-text:hover .mtxt2 {
      color: rgb(200, 70, 70);
    }

    .contact-banner {
      font-size: 1.1rem;
      color: rgb(240, 240, 240);
    }

    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      margin-bottom: 40px;
      border-bottom: 2px solid rgb(25, 25, 25);
      background-color: rgb(45, 45, 45);
      gap: 15px;
    }

    .hero-section p {
      max-width: 550px;
      line-height: 1.6;
      color: rgb(220, 220, 220);
      font-size: 1.05rem;
    }

    .hero-section h1 {
      color: white;
      letter-spacing: 2px;
      font-size: 2.2rem;
      margin-top: 10px;
    }

    .project-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 0 5% 40px;
    }
  </style>
</head>
<body>

  <div id="password-screen">
    <div class="login-box">
      <h2><span class="mtxt1">Rent-A</span><span class="mtxt2">Toy</span></h2>
      <p>Enter the site password to view available rentals.</p>
      <input type="password" id="password-input" placeholder="Password..." onkeydown="if(event.key === 'Enter') checkPassword()">
      <button onclick="checkPassword()">Enter Site</button>
      <p id="error-msg">Incorrect password. Try again!</p>
    </div>
  </div>

  <div id="main-site">
    <div class="top-bar">
      <span class="main-text">
        <h2 class="mtxt1">Rent-A</h2>
        <h2 class="mtxt2">Toy</h2>
      </span>
      <h2 class="contact-banner">Search James Hahn in Outlook on MySCS!</h2>
    </div>

    <div class="hero-section">
      <p>
        <strong>Rent a Toy!</strong> Each period costs money.<br>
        Maker of this site: <strong>Adrian P.</strong> | Manager of the business: <strong>James Hahn</strong>
      </p>
      <h1>--Renting--</h1>
    </div>

    <div class="project-container">
    
    </div>
  </div>
<head>
  <code>
    <script>
      const SITE_PASSWORD = "toysrenttoys";
      function checkPassword() {
        const userInput = document.getElementById("password-input").value;
        const errorMsg = document.getElementById("error-msg");

        if (userInput === SITE_PASSWORD) {
          document.getElementById("password-screen").style.display = "none";
          document.getElementById("main-site").style.display = "block";
        } else {
          errorMsg.style.display = "block";
          document.getElementById("password-input").value = "";
        }
      }
    </script>
  </code>
</head>

</body>
</html>
